<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clair Collective is the number one destination for premium fashion and lifestyle products.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="../cart/cart.js" defer></script>
    <title>Clair Collective | Checkout</title>
<!-- Path: /checkout/index.html
User Stories:
✅As a user, I want to fill out a delivery address form with my details
✅As a user, I want to select from various payment methods (functionality not required - form only)
✅As a user, I want a "Complete Purchase" button that submits my order and takes me to a success page -->
</head>
<body>
<header class="header">
    <div class="off-screen-menu">
        <!-- Code for hamburger menu was taken from https://www.youtube.com/watch?v=aNDqzlAKmZc and modified to fit the project. Link to the GitHub repo: https://github.com/treehouse/ham-menu . Accessed 30.04.2026. -->
        <ul>
            <li><a href="../product/allProducts.html">All Products</a></li>
            <li><a href="../account/login.html">Profile</a></li>
            <li><a href="../cart/index.html">Cart (<span class="cart-count">0</span>)</a></li>
        </ul>
    </div>
    <nav class="nav">
        <div class="logo"><a href="../index.html"><img src="../assets/CC_logo_cropped.png" alt="Clair Collective"></a></div>
        <ul class="navLinks">
            <li><a href="../product/allProducts.html">All Products</a></li>
            <li><a href="../account/login.html">Profile</a></li>
            <li><a href="../cart/index.html">Cart (<span class="cart-count">0</span>)</a></li>
        </ul>
        <div class="ham-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>
</header>
<main>
    <section aria-label="Shopping Cart">
        <h1>Confirm your order</h1>
        <div id="cart-items"></div>
        <div id="cart-total"></div>
        <form id="checkout-form">
            <h2>Delivery Address</h2>
            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div>
                <label for="city">City:</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div>
                <label for="postal-code">Postal Code:</label>
                <input type="text" id="postal-code" name="postal-code" required pattern="\d{5}">
            </div>
            <div>
                <label for="country">Country:</label>
                <input type="text" id="country" name="country" required>
            </div>

            <h2>Payment Method</h2>
            <div class="payment-methods">
                <label><input type="radio" name="payment-method" value="credit-card" required> Credit Card</label>
                <label><input type="radio" name="payment-method" value="paypal"> PayPal</label>
                <label><input type="radio" name="payment-method" value="bank-transfer"> Bank Transfer</label>
            </div>
        <a href="../success/index.html" class="ctaButton" id="completePurchase">Complete Purchase</a>
        <a href="../cart/index.html" class="ctaButton">Go to cart</a>
    </section>
</main>
<footer>
    <div class="logo"><a href="../index.html"><img src="../assets/CC_logo_cropped.png" alt="Clair Collective"></a></div>
    <p>&copy; 2024 Clair Collective. All rights reserved.</p>
</footer>
<script src="../phone.js"></script>
</body>
</html>
